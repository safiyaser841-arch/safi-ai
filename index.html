<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Safi AI</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="app">

    <aside class="sidebar">

      <div class="brand">
        <div class="brand-logo">S</div>

        <div>
          <div class="brand-name">Safi AI</div>
          <div class="brand-small">
            Personal AI
          </div>
        </div>
      </div>

      <button id="newChatBtn" class="new-chat">
        <span>＋</span>
        Neuer Chat
      </button>

      <div class="history-label">
        Deine Chats
      </div>

      <div id="chatHistory" class="chat-history"></div>

      <div class="sidebar-bottom">

        <button id="accountBtn" class="side-btn">
          👤 Konto
        </button>

        <button id="settingsBtn" class="side-btn">
          ⚙ Einstellungen
        </button>

      </div>

    </aside>


    <main class="main">

      <header class="topbar">

        <button id="mobileMenuBtn" class="mobile-menu">
          ☰
        </button>

        <div class="topbar-title">
          Safi AI
        </div>

        <div class="topbar-right">

          <div class="online">
            <span></span>
            Online
          </div>

          <button id="clearChatBtn">
            Chat leeren
          </button>

        </div>

      </header>


      <section class="chat">

        <div id="welcome" class="welcome">

          <div class="welcome-logo">
            S
          </div>

          <h1>
            Hallo, ich bin <span>Safi AI</span>
          </h1>

          <p>
            Dein persönlicher KI-Assistent.
          </p>

          <div class="cards">

            <button
              class="card"
              data-prompt="Erkläre mir etwas Interessantes."
            >
              <b>💡 Lernen</b>
              <small>
                Erkläre mir etwas Interessantes.
              </small>
            </button>

            <button
              class="card"
              data-prompt="Hilf mir beim Programmieren."
            >
              <b>💻 Programmieren</b>
              <small>
                Hilf mir beim Programmieren.
              </small>
            </button>

            <button
              class="card"
              data-prompt="Gib mir eine kreative Idee."
            >
              <b>✨ Kreativ</b>
              <small>
                Gib mir eine kreative Idee.
              </small>
            </button>

            <button
              class="card"
              data-prompt="Erkläre mir ein schwieriges Thema einfach."
            >
              <b>📚 Erklären</b>
              <small>
                Einfach und verständlich.
              </small>
            </button>

          </div>

        </div>


        <div id="messages" class="messages"></div>

      </section>


      <div class="composer-area">

        <div id="filePreview" class="file-preview"></div>

        <div class="composer">

          <input
            type="file"
            id="fileInput"
            multiple
            hidden
          >

          <input
            type="file"
            id="imageInput"
            accept="image/*"
            hidden
          >

          <button
            id="attachBtn"
            class="tool"
            title="Datei"
          >
            📎
          </button>

          <button
            id="imageBtn"
            class="tool"
            title="Bild"
          >
            🖼
          </button>

          <textarea
            id="messageInput"
            placeholder="Nachricht an Safi AI..."
            rows="1"
          ></textarea>

          <button
            id="micBtn"
            class="tool"
            title="Mikrofon"
          >
            🎤
          </button>

          <button
            id="sendBtn"
            class="send"
          >
            ➤
          </button>

        </div>

        <div class="hint">
          Safi AI kann Fehler machen. Prüfe wichtige Informationen.
        </div>

      </div>

    </main>

  </div>


  <!-- ACCOUNT -->

  <div id="accountModal" class="modal hidden">

    <div class="modal-box">

      <button
        class="close"
        data-close="accountModal"
      >
        ×
      </button>

      <h2>Konto</h2>

      <p>
        Konto-Funktionen kommen später.
      </p>

      <button
        class="primary"
        data-close="accountModal"
      >
        Schließen
      </button>

    </div>

  </div>


  <!-- SETTINGS -->

  <div id="settingsModal" class="modal hidden">

    <div class="modal-box">

      <button
        class="close"
        data-close="settingsModal"
      >
        ×
      </button>

      <h2>Einstellungen</h2>

      <div class="setting">

        <div>
          <b>Design</b>
          <small>
            Helles oder dunkles Design
          </small>
        </div>

        <button id="themeBtn">
          Dunkel
        </button>

      </div>

      <div class="setting">

        <div>
          <b>Chats</b>
          <small>
            Auf diesem Gerät speichern
          </small>
        </div>

        <button id="storageBtn">
          An
        </button>

      </div>

    </div>

  </div>


  <script src="/script.js"></script>

</body>
</html>
